[tool.poetry]
name = "fashion-mnist-clustering"
version = "1.0.0"
description = "Fashion-MNIST Dimensionality Reduction & Clustering Pipeline"
authors = [
    "Panagiotis Amanatiadis <aid25007@uom.edu.gr>",
    "Giorgos Chalkias <aid26004@uom.edu.gr>",
]
readme = "README.md"
packages = [{include = "fashion_clustering", from = "src"}]

[tool.poetry.scripts]
run-pipeline = "fashion_clustering.pipeline.experiment:main"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
numpy = "^1.26"
pandas = "^2.1"
scikit-learn = "^1.3"
matplotlib = "^3.8"
seaborn = "^0.13"
tensorflow = "^2.15"
umap-learn = "^0.5"
hdbscan = "^0.8"
omegaconf = "^2.3"
loguru = "^0.7"
click = "^8.1"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
ruff = "^0.1"
black = "^23.0"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
