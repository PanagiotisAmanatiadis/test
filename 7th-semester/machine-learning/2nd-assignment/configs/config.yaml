seed: 42
data:
  val_split: 0.1666
  test_size: 10000

reduction:
  pca:
    n_components: 50
  sae:
    layers: [512, 256, 128, 64]
    latent_dim: 32
    epochs: 30
    batch_size: 256
    learning_rate: 0.001
  cnn_sae:
    filters: [32, 64]
    latent_dim: 32
    epochs: 30
    batch_size: 256
  umap:
    n_components: 32
    n_neighbors: 15
    min_dist: 0.1
  tsne:
    n_components: 2
    perplexity: 30

clustering:
  minibatch_kmeans:
    n_clusters: 10
    batch_size: 1024
  dbscan:
    eps: 0.5
    min_samples: 5
  agglomerative:
    n_clusters: 10
    linkage: ward
  gmm:
    n_components: 10
    covariance_type: full
  hdbscan:
    min_cluster_size: 50

visualization:
  figures_dir: reports/figures
  dpi: 150
  style: seaborn-v0_8-whitegrid
  palette: tab10
  selected_classes: [0, 2, 5, 7]

paths:
  logs_dir: logs
  figures_dir: reports/figures
  latex_dir: reports/latex
  results_csv: reports/results.csv
