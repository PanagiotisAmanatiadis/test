[project]
name = "diabetes-reg"
version = "1.0.0"
description = "Diabetes Progression Regression Pipeline"
authors = [
    {name = "Panagiotis Amanatiadis", email = "aid25007@uom.edu.gr"},
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "shap>=0.44",
    "omegaconf>=2.3",
    "loguru>=0.7",
    "click>=8.1",
]

[project.scripts]
run-pipeline = "diabetes_reg.pipeline.experiment:main"

[dependency-groups]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diabetes_reg"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
